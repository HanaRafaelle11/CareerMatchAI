# Automated Edge Functions Deployment Workflow - Active
name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Cancela runs anteriores automaticamente se um novo push for realizado
concurrency:
  group: deploy-supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-edge-functions:
    name: Deploy Edge Functions to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Deploy All 13 Edge Functions to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy analyze-resume billing-checkout billing-portal billing-webhook chat-copilot ingest-inhire-jobs match-job parse-job resend-webhook search-jobs send-support-ticket simulate-interview weekly-digest --project-ref bdlpfrwebsmpohtclnxf
