name: Lighthouse CI Performance & Web Vitals Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lighthouse:
    name: Lighthouse Web Vitals & Performance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Run Lighthouse CI with Strict Score Budgets
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
